<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">典型神经网络架构地图</title><desc id="desc">MLP、CNN、RNN、ResNet和Transformer针对不同信息结构解决不同问题。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#F4F8F6"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#94A3B8"/></marker></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/>
  <text x="64" y="82" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#14213D">网络架构不是“新的一定淘汰旧的”，而是不同的信息处理工具</text>
  <path d="M150 350H1130" stroke="#CBD5E1" stroke-width="5" marker-end="url(#a)"/>
  <g font-family="Microsoft YaHei, sans-serif" text-anchor="middle">
    <g transform="translate(66 160)"><rect width="210" height="380" rx="25" fill="#FFFFFF" stroke="#D9E4F2" stroke-width="2"/><circle cx="105" cy="90" r="48" fill="#E7F1FF"/><g fill="#3B82C4"><circle cx="88" cy="78" r="7"/><circle cx="122" cy="78" r="7"/><circle cx="105" cy="108" r="7"/></g><path d="M88 78l17 30 17-30M88 78h34" stroke="#3B82C4" stroke-width="3"/><text x="105" y="174" font-size="27" font-weight="700" fill="#245D91">MLP</text><text x="105" y="210" font-size="17" fill="#64748B">全连接组合特征</text><text x="105" y="258" font-size="18" font-weight="600" fill="#334155">适合</text><text x="105" y="290" font-size="17" fill="#64748B">通用分类与回归</text><text x="105" y="332" font-size="17" fill="#64748B">也是许多网络的</text><text x="105" y="360" font-size="17" fill="#64748B">基础模块</text></g>
    <g transform="translate(302 160)"><rect width="210" height="380" rx="25" fill="#FFFFFF" stroke="#CDE8DD" stroke-width="2"/><circle cx="105" cy="90" r="48" fill="#E5F7EF"/><g fill="#16A085"><rect x="76" y="62" width="18" height="18" rx="3"/><rect x="98" y="62" width="18" height="18" rx="3"/><rect x="120" y="62" width="18" height="18" rx="3"/><rect x="76" y="84" width="18" height="18" rx="3"/><rect x="98" y="84" width="18" height="18" rx="3"/><rect x="120" y="84" width="18" height="18" rx="3"/><rect x="76" y="106" width="18" height="18" rx="3"/><rect x="98" y="106" width="18" height="18" rx="3"/><rect x="120" y="106" width="18" height="18" rx="3"/></g><text x="105" y="174" font-size="27" font-weight="700" fill="#0D7862">CNN</text><text x="105" y="210" font-size="17" fill="#64748B">复用局部观察窗口</text><text x="105" y="258" font-size="18" font-weight="600" fill="#334155">擅长</text><text x="105" y="290" font-size="17" fill="#64748B">图片与空间结构</text><text x="105" y="332" font-size="17" fill="#64748B">边缘、纹理</text><text x="105" y="360" font-size="17" fill="#64748B">局部形状</text></g>
    <g transform="translate(538 160)"><rect width="210" height="380" rx="25" fill="#FFFFFF" stroke="#F0D8B7" stroke-width="2"/><circle cx="105" cy="90" r="48" fill="#FFF3E2"/><path d="M75 93h48M116 80l14 13-14 13" fill="none" stroke="#DC842E" stroke-width="5" stroke-linecap="round"/><path d="M89 73c-18 8-18 32 0 40" fill="none" stroke="#DC842E" stroke-width="5"/><text x="105" y="174" font-size="27" font-weight="700" fill="#A65A16">RNN / LSTM</text><text x="105" y="210" font-size="17" fill="#64748B">携带历史状态</text><text x="105" y="258" font-size="18" font-weight="600" fill="#334155">擅长</text><text x="105" y="290" font-size="17" fill="#64748B">序列与时间变化</text><text x="105" y="332" font-size="17" fill="#64748B">语言、语音</text><text x="105" y="360" font-size="17" fill="#64748B">时间序列</text></g>
    <g transform="translate(774 160)"><rect width="210" height="380" rx="25" fill="#FFFFFF" stroke="#DED2F1" stroke-width="2"/><circle cx="105" cy="90" r="48" fill="#F1E9FF"/><path d="M77 69h55M77 90h55M77 111h55M84 63v54M126 63v54" stroke="#805AD5" stroke-width="4"/><path d="M62 78v55h82" fill="none" stroke="#805AD5" stroke-width="5"/><text x="105" y="174" font-size="27" font-weight="700" fill="#6B46A0">ResNet</text><text x="105" y="210" font-size="17" fill="#64748B">用跨层捷径传递信息</text><text x="105" y="258" font-size="18" font-weight="600" fill="#334155">解决</text><text x="105" y="290" font-size="17" fill="#64748B">深层网络难训练</text><text x="105" y="332" font-size="17" fill="#64748B">视觉骨干与</text><text x="105" y="360" font-size="17" fill="#64748B">多类深层模型</text></g>
    <g transform="translate(1010 160)"><rect width="210" height="380" rx="25" fill="#FFFFFF" stroke="#C9DDF5" stroke-width="2"/><circle cx="105" cy="90" r="48" fill="#EAF2FF"/><g stroke="#3867D6" stroke-width="3" fill="#FFFFFF"><circle cx="72" cy="77" r="8"/><circle cx="105" cy="68" r="8"/><circle cx="138" cy="79" r="8"/><circle cx="83" cy="112" r="8"/><circle cx="126" cy="111" r="8"/><path d="M79 79l19-8M112 70l19 6M76 84l5 20M102 75l-15 30M109 76l14 27M136 87l-8 16"/></g><text x="105" y="174" font-size="27" font-weight="700" fill="#2C55A2">Transformer</text><text x="105" y="210" font-size="17" fill="#64748B">按需要联系不同位置</text><text x="105" y="258" font-size="18" font-weight="600" fill="#334155">擅长</text><text x="105" y="290" font-size="17" fill="#64748B">长距离关系与并行</text><text x="105" y="332" font-size="17" fill="#64748B">语言、多模态</text><text x="105" y="360" font-size="17" fill="#64748B">视觉与语音</text></g>
  </g>
  <text x="640" y="624" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#526274">现代系统常把多种结构组合起来；选择架构应从数据特点、目标和资源出发。</text>
</svg>
