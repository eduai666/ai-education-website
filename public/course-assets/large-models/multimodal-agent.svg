<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">多模态模型、Agent与物理世界</title><desc id="desc">文字、图像和声音进入模型，模型通过工具行动，或连接机器人控制器影响物理世界。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFF"/><stop offset="1" stop-color="#F3F9F6"/></linearGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3B5ED7"/><stop offset=".55" stop-color="#6D55C5"/><stop offset="1" stop-color="#16A085"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#64748B"/></marker><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".12"/></filter></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/>
  <text x="64" y="82" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#14213D">大模型成为“系统底座”后，能力来自模型、工具与权限的共同作用</text>
  <g font-family="Microsoft YaHei, sans-serif" filter="url(#s)">
    <g transform="translate(58 160)"><rect width="230" height="390" rx="28" fill="#FFFFFF" stroke="#D8E2EE" stroke-width="2"/><text x="115" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#334155">多模态输入</text><g transform="translate(35 84)"><rect width="160" height="62" rx="15" fill="#EEF5FF"/><text x="80" y="40" text-anchor="middle" font-size="20" fill="#245D91">文字与代码</text><rect y="78" width="160" height="62" rx="15" fill="#EFFAF6"/><text x="80" y="118" text-anchor="middle" font-size="20" fill="#0D7862">图片与视频</text><rect y="156" width="160" height="62" rx="15" fill="#F5F0FF"/><text x="80" y="196" text-anchor="middle" font-size="20" fill="#654294">声音与语音</text><rect y="234" width="160" height="62" rx="15" fill="#FFF5E8"/><text x="80" y="274" text-anchor="middle" font-size="20" fill="#A65A16">传感器状态</text></g></g>
    <g transform="translate(440 185)"><rect width="400" height="340" rx="42" fill="url(#core)"/><text x="200" y="72" text-anchor="middle" font-size="30" font-weight="700" fill="#FFFFFF">大模型核心</text><text x="200" y="111" text-anchor="middle" font-size="18" fill="#E8ECFF">理解上下文 · 规划下一步 · 生成输出</text><g fill="#FFFFFF" fill-opacity=".22" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="2"><circle cx="105" cy="191" r="22"/><circle cx="200" cy="157" r="22"/><circle cx="295" cy="191" r="22"/><circle cx="150" cy="258" r="22"/><circle cx="250" cy="258" r="22"/><path d="M124 183l56-20M220 163l56 20M119 205l19 39M281 205l-19 39M172 258h56M200 179l-36 60M200 179l36 60"/></g><text x="200" y="314" text-anchor="middle" font-size="17" fill="#E8ECFF">能力强不等于可以无限制行动</text></g>
    <g transform="translate(992 137)"><rect width="230" height="180" rx="28" fill="#FFFFFF" stroke="#CDE0F4" stroke-width="2"/><text x="115" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#245D91">数字世界</text><text x="115" y="92" text-anchor="middle" font-size="19" fill="#64748B">搜索 · 计算 · 代码</text><text x="115" y="126" text-anchor="middle" font-size="19" fill="#64748B">文件 · 软件 · 消息</text><text x="115" y="157" text-anchor="middle" font-size="16" fill="#8A98A9">通过工具与 API 行动</text></g>
    <g transform="translate(992 393)"><rect width="230" height="180" rx="28" fill="#FFFFFF" stroke="#CBE7DD" stroke-width="2"/><text x="115" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#0D7862">物理世界</text><text x="115" y="92" text-anchor="middle" font-size="19" fill="#64748B">机器人 · 车辆 · 无人机</text><text x="115" y="126" text-anchor="middle" font-size="19" fill="#64748B">控制器 · 传感器 · 急停</text><text x="115" y="157" text-anchor="middle" font-size="16" fill="#8A98A9">动作必须经过安全边界</text></g>
  </g>
  <g fill="none" stroke="#64748B" stroke-width="5" marker-end="url(#a)"><path d="M300 355h124"/><path d="M856 301h120"/><path d="M856 437h120"/></g>
  <rect x="236" y="616" width="808" height="58" rx="17" fill="#FFF3E2"/>
  <text x="640" y="653" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#9A571B">高影响操作应设置最小权限、人工确认、可撤销机制和完整记录。</text>
</svg>
