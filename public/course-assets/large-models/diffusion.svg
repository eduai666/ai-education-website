<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">扩散模型从噪声逐步生成图像</title><desc id="desc">文字条件引导模型把随机噪声逐步修正为结构和细节清晰的图片。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9FAFF"/><stop offset="1" stop-color="#F5F9F7"/></linearGradient><pattern id="noise1" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#CED5E0"/><circle cx="3" cy="4" r="2" fill="#7E8AA0"/><circle cx="12" cy="10" r="3" fill="#F3F5F8"/><circle cx="6" cy="14" r="2" fill="#59677D"/></pattern><pattern id="noise2" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#CFDBE7"/><circle cx="7" cy="7" r="5" fill="#7E9FB8" opacity=".55"/><circle cx="18" cy="15" r="6" fill="#F2CFA2" opacity=".55"/></pattern><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#64748B"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/>
  <text x="64" y="82" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#14213D">扩散生成：在文字条件引导下，一步步把噪声修正成画面</text>
  <rect x="352" y="112" width="576" height="64" rx="20" fill="#F1E9FF"/>
  <text x="640" y="151" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#654294">提示词：橘猫 · 蓝围巾 · 雪地 · 儿童绘本风格</text>
  <g font-family="Microsoft YaHei, sans-serif" text-anchor="middle" filter="url(#s)">
    <g transform="translate(64 232)"><rect width="240" height="260" rx="24" fill="#FFFFFF"/><rect x="25" y="25" width="190" height="150" rx="16" fill="url(#noise1)"/><text x="120" y="216" font-size="23" font-weight="700" fill="#334155">随机噪声</text><text x="120" y="245" font-size="17" fill="#64748B">还没有可辨认结构</text></g>
    <g transform="translate(372 232)"><rect width="240" height="260" rx="24" fill="#FFFFFF"/><rect x="25" y="25" width="190" height="150" rx="16" fill="url(#noise2)"/><ellipse cx="122" cy="102" rx="55" ry="38" fill="#DC9C53" opacity=".56"/><text x="120" y="216" font-size="23" font-weight="700" fill="#334155">粗略色块</text><text x="120" y="245" font-size="17" fill="#64748B">方向开始受条件影响</text></g>
    <g transform="translate(680 232)"><rect width="240" height="260" rx="24" fill="#FFFFFF"/><rect x="25" y="25" width="190" height="150" rx="16" fill="#DDECF4"/><ellipse cx="120" cy="116" rx="58" ry="39" fill="#D9964E"/><circle cx="120" cy="73" r="38" fill="#E1A258"/><path d="M88 53l8-29 22 24M152 53l-8-29-22 24" fill="#D8893D"/><path d="M89 115c26 14 43 14 64 0" fill="none" stroke="#4A73C7" stroke-width="11"/><text x="120" y="216" font-size="23" font-weight="700" fill="#334155">主体与轮廓</text><text x="120" y="245" font-size="17" fill="#64748B">对象和构图逐渐稳定</text></g>
    <g transform="translate(988 232)"><rect width="228" height="260" rx="24" fill="#FFFFFF"/><rect x="19" y="25" width="190" height="150" rx="16" fill="#EAF5FB"/><g fill="#FFFFFF" opacity=".9"><circle cx="43" cy="51" r="5"/><circle cx="185" cy="74" r="4"/><circle cx="63" cy="146" r="5"/><circle cx="164" cy="37" r="4"/></g><ellipse cx="114" cy="116" rx="58" ry="39" fill="#E09A49"/><circle cx="114" cy="73" r="38" fill="#E7A65B"/><path d="M82 53l8-29 22 24M146 53l-8-29-22 24" fill="#D9853B"/><circle cx="102" cy="71" r="4" fill="#273549"/><circle cx="126" cy="71" r="4" fill="#273549"/><path d="M110 82h8l-4 5z" fill="#8C4B31"/><path d="M82 114c24 16 47 16 65 0" fill="none" stroke="#416FCC" stroke-width="12"/><text x="114" y="216" font-size="23" font-weight="700" fill="#334155">细节完成</text><text x="114" y="245" font-size="17" fill="#64748B">解码为最终像素图片</text></g>
  </g>
  <g stroke="#64748B" stroke-width="4" marker-end="url(#a)"><path d="M310 362h48"/><path d="M618 362h48"/><path d="M926 362h48"/></g>
  <rect x="130" y="560" width="1020" height="92" rx="22" fill="#E9F2FF"/>
  <text x="640" y="596" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#214E86">模型不是从图库中“取出成品”，而是在学到的视觉分布中寻找一条生成路径</text>
  <text x="640" y="628" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#526274">随机种子改变初始噪声；提示词改变每一步更应靠近哪类画面。不同系统也可能采用流模型或视觉 Token。</text>
</svg>
