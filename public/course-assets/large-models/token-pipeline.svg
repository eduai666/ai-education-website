<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">文字进入大语言模型的流程</title><desc id="desc">文字被切分为token，映射为编号和向量，加入位置信息后进入Transformer。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFF"/><stop offset="1" stop-color="#F4F9F8"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11Z" fill="#64748B"/></marker><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#17324D" flood-opacity=".1"/></filter></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/>
  <text x="64" y="82" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#14213D">一句话进入大语言模型后，先经历四次“换一种表示”</text>
  <g fill="none" stroke="#64748B" stroke-width="4" marker-end="url(#a)"><path d="M286 358h72"/><path d="M566 358h72"/><path d="M846 358h72"/></g>
  <g font-family="Microsoft YaHei, sans-serif" filter="url(#s)">
    <g transform="translate(56 210)"><rect width="230" height="296" rx="28" fill="#FFFFFF" stroke="#CDE0F5" stroke-width="2"/><circle cx="115" cy="74" r="42" fill="#E7F1FF"/><path d="M92 62h46M92 78h34M92 94h42" stroke="#3975BC" stroke-width="5" stroke-linecap="round"/><text x="115" y="151" text-anchor="middle" font-size="25" font-weight="700" fill="#245D91">原始文字</text><text x="115" y="192" text-anchor="middle" font-size="18" fill="#64748B">“人工智能正在学习”</text><text x="115" y="235" text-anchor="middle" font-size="17" fill="#64748B">人能阅读</text><text x="115" y="264" text-anchor="middle" font-size="17" fill="#64748B">模型还不能直接计算</text></g>
    <g transform="translate(336 210)"><rect width="230" height="296" rx="28" fill="#FFFFFF" stroke="#DED2F3" stroke-width="2"/><g transform="translate(31 52)"><rect width="52" height="44" rx="10" fill="#7651B5"/><rect x="58" width="52" height="44" rx="10" fill="#4F67D8"/><rect x="116" width="52" height="44" rx="10" fill="#1DA6A0"/><text x="26" y="29" text-anchor="middle" font-size="16" fill="#FFF">人工</text><text x="84" y="29" text-anchor="middle" font-size="16" fill="#FFF">智能</text><text x="142" y="29" text-anchor="middle" font-size="16" fill="#FFF">学习</text></g><text x="115" y="151" text-anchor="middle" font-size="25" font-weight="700" fill="#654294">Token</text><text x="115" y="192" text-anchor="middle" font-size="18" fill="#64748B">词、子词、字或符号</text><text x="115" y="235" text-anchor="middle" font-size="17" fill="#64748B">不同分词器</text><text x="115" y="264" text-anchor="middle" font-size="17" fill="#64748B">切法可能不同</text></g>
    <g transform="translate(616 210)"><rect width="230" height="296" rx="28" fill="#FFFFFF" stroke="#C9E7DE" stroke-width="2"/><circle cx="115" cy="74" r="42" fill="#E4F7F0"/><text x="115" y="83" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="700" fill="#0F8A70">[18, 7, 42]</text><text x="115" y="151" text-anchor="middle" font-size="25" font-weight="700" fill="#0D7862">编号</text><text x="115" y="192" text-anchor="middle" font-size="18" fill="#64748B">词表中的查表地址</text><text x="115" y="235" text-anchor="middle" font-size="17" fill="#64748B">数字大小本身</text><text x="115" y="264" text-anchor="middle" font-size="17" fill="#64748B">不代表语义大小</text></g>
    <g transform="translate(896 210)"><rect width="328" height="296" rx="28" fill="#FFFFFF" stroke="#C8D8F3" stroke-width="2"/><g transform="translate(65 48)" fill="#5575D6"><rect x="0" y="45" width="18" height="20" rx="3"/><rect x="27" y="25" width="18" height="40" rx="3"/><rect x="54" y="5" width="18" height="60" rx="3"/><rect x="81" y="35" width="18" height="30" rx="3"/><rect x="108" y="18" width="18" height="47" rx="3"/><rect x="135" y="42" width="18" height="23" rx="3"/><rect x="162" y="10" width="18" height="55" rx="3"/><rect x="189" y="30" width="18" height="35" rx="3"/></g><text x="164" y="151" text-anchor="middle" font-size="25" font-weight="700" fill="#2C55A2">向量 + 位置</text><text x="164" y="192" text-anchor="middle" font-size="18" fill="#64748B">可学习的高维表示</text><text x="164" y="235" text-anchor="middle" font-size="17" fill="#64748B">既表达“是什么”</text><text x="164" y="264" text-anchor="middle" font-size="17" fill="#64748B">也表达“在哪里”</text></g>
  </g>
  <rect x="208" y="570" width="864" height="72" rx="20" fill="#E9F2FF"/>
  <text x="640" y="601" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="700" fill="#214E86">进入 Transformer 后，同一个 Token 的向量会根据上下文不断变化</text>
  <text x="640" y="631" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#526274">“苹果很好吃”与“苹果发布设备”中的“苹果”，最终会形成不同的上下文表示。</text>
</svg>
