<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">大语言模型逐token生成回答</title><desc id="desc">模型根据前文计算候选token概率，选择一个接回上下文并重复。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFF"/><stop offset="1" stop-color="#F4F9F8"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5 0 11Z" fill="#64748B"/></marker><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".1"/></filter></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/>
  <text x="64" y="82" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#14213D">大语言模型每次只走一小步，许多小步连成完整回答</text>
  <g font-family="Microsoft YaHei, sans-serif" filter="url(#s)">
    <g transform="translate(70 190)"><rect width="320" height="205" rx="28" fill="#FFFFFF" stroke="#CFE0F3" stroke-width="2"/><text x="32" y="52" font-size="21" fill="#64748B">当前上下文</text><rect x="30" y="77" width="260" height="72" rx="15" fill="#EEF5FF"/><text x="160" y="121" text-anchor="middle" font-size="27" font-weight="700" fill="#245D91">“北京是中国的”</text><text x="32" y="181" font-size="18" fill="#64748B">前面所有 token 都参与计算</text></g>
    <g transform="translate(480 145)"><rect width="330" height="295" rx="28" fill="#173B53"/><text x="165" y="55" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">Transformer</text><text x="165" y="88" text-anchor="middle" font-size="17" fill="#CFE4EE">为词表中每个候选计算分数</text><g transform="translate(42 122)"><text x="0" y="20" font-size="18" fill="#FFFFFF">首都</text><rect x="68" y="2" width="170" height="22" rx="11" fill="#2B536A"/><rect x="68" y="2" width="144" height="22" rx="11" fill="#33B08F"/><text x="249" y="20" font-size="16" fill="#CFE4EE">78%</text><text x="0" y="66" font-size="18" fill="#FFFFFF">城市</text><rect x="68" y="48" width="170" height="22" rx="11" fill="#2B536A"/><rect x="68" y="48" width="58" height="22" rx="11" fill="#6980DC"/><text x="249" y="66" font-size="16" fill="#CFE4EE">8%</text><text x="0" y="112" font-size="18" fill="#FFFFFF">中心</text><rect x="68" y="94" width="170" height="22" rx="11" fill="#2B536A"/><rect x="68" y="94" width="39" height="22" rx="11" fill="#9A77D2"/><text x="249" y="112" font-size="16" fill="#CFE4EE">4%</text></g></g>
    <g transform="translate(900 190)"><rect width="310" height="205" rx="28" fill="#FFFFFF" stroke="#C8E5DA" stroke-width="2"/><text x="31" y="52" font-size="21" fill="#64748B">选出下一个 token</text><rect x="31" y="77" width="118" height="72" rx="15" fill="#DFF7EE"/><text x="90" y="122" text-anchor="middle" font-size="29" font-weight="700" fill="#0F8A70">首都</text><text x="31" y="181" font-size="18" fill="#64748B">最高概率或按规则采样</text></g>
  </g>
  <path d="M397 292h68M817 292h68" stroke="#64748B" stroke-width="5" marker-end="url(#a)"/>
  <path d="M1050 408C1037 553 295 578 228 421" fill="none" stroke="#64748B" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#a)"/>
  <rect x="310" y="505" width="660" height="72" rx="20" fill="#F1E9FF"/>
  <text x="640" y="536" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#654294">把“首都”接回上下文，再预测下一步</text>
  <text x="640" y="565" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#64748B">预测 → 接回 → 再预测 → 持续到结束，这就是自回归生成。</text>
  <text x="640" y="650" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#526274">概率高只代表“更符合模型学到的模式”，不等于现实中必然正确。</text>
</svg>
