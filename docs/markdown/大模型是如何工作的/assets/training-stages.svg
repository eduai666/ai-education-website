<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">从基础模型到AI助手的训练与系统层</title><desc id="desc">预训练、指令微调、偏好对齐以及工具和安全系统共同形成AI助手。</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFF"/><stop offset="1" stop-color="#F4F9F8"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#64748B"/></marker><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-opacity=".1"/></filter></defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/>
  <text x="64" y="82" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#14213D">会续写的基础模型，怎样变成更有帮助的 AI 助手？</text>
  <g font-family="Microsoft YaHei, sans-serif" filter="url(#s)">
    <g transform="translate(65 180)"><rect width="250" height="305" rx="28" fill="#FFFFFF" stroke="#CDE0F4" stroke-width="2"/><circle cx="125" cy="71" r="38" fill="#E7F1FF"/><path d="M104 59h42M104 72h42M104 85h31" stroke="#3975BC" stroke-width="4" stroke-linecap="round"/><text x="125" y="145" text-anchor="middle" font-size="25" font-weight="700" fill="#245D91">1  预训练</text><text x="125" y="182" text-anchor="middle" font-size="18" fill="#64748B">海量、多样的数据</text><text x="125" y="220" text-anchor="middle" font-size="17" fill="#64748B">学习语言、知识模式</text><text x="125" y="249" text-anchor="middle" font-size="17" fill="#64748B">代码与上下文关系</text><rect x="35" y="270" width="180" height="42" rx="13" fill="#EEF5FF"/><text x="125" y="298" text-anchor="middle" font-size="17" font-weight="600" fill="#245D91">得到基础模型</text></g>
    <g transform="translate(355 180)"><rect width="250" height="305" rx="28" fill="#FFFFFF" stroke="#CBE8DE" stroke-width="2"/><circle cx="125" cy="71" r="38" fill="#E4F7F0"/><path d="M108 72l11 11 24-29" fill="none" stroke="#0F8A70" stroke-width="5"/><text x="125" y="145" text-anchor="middle" font-size="25" font-weight="700" fill="#0D7862">2  指令微调</text><text x="125" y="182" text-anchor="middle" font-size="18" fill="#64748B">指令—优质回答示例</text><text x="125" y="220" text-anchor="middle" font-size="17" fill="#64748B">学习直接回答</text><text x="125" y="249" text-anchor="middle" font-size="17" fill="#64748B">格式、步骤与约束</text><rect x="35" y="270" width="180" height="42" rx="13" fill="#EFFAF6"/><text x="125" y="298" text-anchor="middle" font-size="17" font-weight="600" fill="#0D7862">更会执行任务</text></g>
    <g transform="translate(645 180)"><rect width="250" height="305" rx="28" fill="#FFFFFF" stroke="#DED2F3" stroke-width="2"/><circle cx="125" cy="71" r="38" fill="#F1E9FF"/><path d="M96 67h58M108 55l-12 12 12 12M142 55l12 12-12 12" fill="none" stroke="#7651B5" stroke-width="4"/><text x="125" y="145" text-anchor="middle" font-size="25" font-weight="700" fill="#654294">3  偏好对齐</text><text x="125" y="182" text-anchor="middle" font-size="18" fill="#64748B">比较多个候选回答</text><text x="125" y="220" text-anchor="middle" font-size="17" fill="#64748B">更有帮助、更安全</text><text x="125" y="249" text-anchor="middle" font-size="17" fill="#64748B">更诚实地表达边界</text><rect x="35" y="270" width="180" height="42" rx="13" fill="#F5F0FF"/><text x="125" y="298" text-anchor="middle" font-size="17" font-weight="600" fill="#654294">更符合人的要求</text></g>
    <g transform="translate(935 180)"><rect width="280" height="305" rx="28" fill="#173B53"/><circle cx="140" cy="71" r="38" fill="#2B536A"/><path d="M118 72h44M140 50v44" stroke="#55D0B0" stroke-width="5"/><text x="140" y="145" text-anchor="middle" font-size="25" font-weight="700" fill="#FFFFFF">4  产品系统</text><text x="140" y="182" text-anchor="middle" font-size="18" fill="#CFE4EE">系统指令 · 搜索 · 工具</text><text x="140" y="220" text-anchor="middle" font-size="17" fill="#CFE4EE">记忆 · 权限 · 安全检查</text><text x="140" y="249" text-anchor="middle" font-size="17" fill="#CFE4EE">界面与人工确认</text><rect x="48" y="270" width="184" height="42" rx="13" fill="#2B536A"/><text x="140" y="298" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">形成可使用的助手</text></g>
  </g>
  <g stroke="#64748B" stroke-width="4" marker-end="url(#a)"><path d="M320 332h28"/><path d="M610 332h28"/><path d="M900 332h28"/></g>
  <rect x="170" y="555" width="940" height="76" rx="20" fill="#FFF3E2"/>
  <text x="640" y="586" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="21" font-weight="700" fill="#9A571B">“模型”不等于“聊天产品”</text>
  <text x="640" y="615" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#64748B">回答质量可能来自底层模型，也可能来自搜索、工具、系统规则和产品流程。</text>
</svg>
