<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">欠拟合、合适拟合与过拟合</title><desc id="desc">三幅示意图展示模型过于简单、抓住主要规律和追随训练噪声的区别。</desc>
  <rect width="1280" height="720" rx="32" fill="#F8FAFC"/>
  <text x="64" y="82" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#14213D">真正的目标不是记住训练题，而是把规律用到新问题</text>
  <g font-family="Microsoft YaHei, sans-serif">
    <g transform="translate(65 150)"><rect width="350" height="450" rx="26" fill="#FFFFFF" stroke="#DCE4ED" stroke-width="2"/><text x="175" y="55" text-anchor="middle" font-size="26" font-weight="700" fill="#C15A3A">欠拟合</text><text x="175" y="86" text-anchor="middle" font-size="17" fill="#64748B">模型太简单，训练题也做不好</text><rect x="35" y="115" width="280" height="235" rx="16" fill="#FBFCFE" stroke="#E3E9F0"/><g fill="#4A77C5"><circle cx="74" cy="308" r="6"/><circle cx="98" cy="282" r="6"/><circle cx="123" cy="264" r="6"/><circle cx="151" cy="220" r="6"/><circle cx="181" cy="206" r="6"/><circle cx="211" cy="171" r="6"/><circle cx="247" cy="154" r="6"/><circle cx="282" cy="133" r="6"/></g><path d="M58 278L294 190" stroke="#E36B4B" stroke-width="6" stroke-linecap="round"/><text x="175" y="397" text-anchor="middle" font-size="18" fill="#475569">没有学到足够规律</text></g>
    <g transform="translate(465 150)"><rect width="350" height="450" rx="26" fill="#FFFFFF" stroke="#BFE6D7" stroke-width="3"/><text x="175" y="55" text-anchor="middle" font-size="26" font-weight="700" fill="#0F8A70">合适拟合</text><text x="175" y="86" text-anchor="middle" font-size="17" fill="#64748B">抓住主趋势，也容纳合理变化</text><rect x="35" y="115" width="280" height="235" rx="16" fill="#FBFCFE" stroke="#E3E9F0"/><g fill="#4A77C5"><circle cx="74" cy="308" r="6"/><circle cx="98" cy="282" r="6"/><circle cx="123" cy="264" r="6"/><circle cx="151" cy="220" r="6"/><circle cx="181" cy="206" r="6"/><circle cx="211" cy="171" r="6"/><circle cx="247" cy="154" r="6"/><circle cx="282" cy="133" r="6"/></g><path d="M58 315C118 302 119 229 180 211S235 149 294 132" fill="none" stroke="#16A085" stroke-width="6" stroke-linecap="round"/><text x="175" y="397" text-anchor="middle" font-size="18" fill="#475569">对新数据仍可能有效</text></g>
    <g transform="translate(865 150)"><rect width="350" height="450" rx="26" fill="#FFFFFF" stroke="#E0D5F4" stroke-width="2"/><text x="175" y="55" text-anchor="middle" font-size="26" font-weight="700" fill="#7552A8">过拟合</text><text x="175" y="86" text-anchor="middle" font-size="17" fill="#64748B">训练题很好，新题明显变差</text><rect x="35" y="115" width="280" height="235" rx="16" fill="#FBFCFE" stroke="#E3E9F0"/><g fill="#4A77C5"><circle cx="74" cy="308" r="6"/><circle cx="98" cy="282" r="6"/><circle cx="123" cy="264" r="6"/><circle cx="151" cy="220" r="6"/><circle cx="181" cy="206" r="6"/><circle cx="211" cy="171" r="6"/><circle cx="247" cy="154" r="6"/><circle cx="282" cy="133" r="6"/></g><path d="M58 320C75 301 74 276 98 282s1-28 25-18 9-49 28-44 12-30 30-14 10-47 30-35 13-35 36-17 19-38 47-21" fill="none" stroke="#805AD5" stroke-width="6" stroke-linecap="round"/><text x="175" y="397" text-anchor="middle" font-size="18" fill="#475569">把噪声和偶然线索也背下来了</text></g>
  </g>
  <rect x="168" y="632" width="944" height="56" rx="16" fill="#E9F2FF"/><text x="640" y="668" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" font-weight="600" fill="#214E86">使用独立验证集与测试集，才能判断模型是否真正具有泛化能力。</text>
</svg>
