<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">从数据到预测的机器学习流程</title>
  <desc id="desc">数据和标签经过学习算法形成模型，模型再对新数据作出预测。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FBFF"/><stop offset="1" stop-color="#F2F8F5"/></linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#16A085"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#17324D" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#64748B"/></marker>
  </defs>
  <rect width="1280" height="720" rx="32" fill="url(#bg)"/>
  <text x="72" y="82" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#14213D">机器学习不是背答案，而是学习一套可用于新问题的规律</text>
  <text x="72" y="124" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#5B6B7F">训练阶段调整参数，推理阶段使用已学到的参数</text>
  <g filter="url(#shadow)">
    <rect x="72" y="194" width="250" height="172" rx="24" fill="#FFFFFF"/>
    <circle cx="126" cy="247" r="22" fill="#DFF7EE"/><path d="M114 247h24M126 235v24" stroke="#0F9D75" stroke-width="4" stroke-linecap="round"/>
    <text x="166" y="255" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#14213D">训练数据</text>
    <text x="104" y="311" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#5B6B7F">图片、文字、声音、数字</text>
    <text x="104" y="341" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#5B6B7F">尽量真实、多样、准确</text>
    <rect x="72" y="397" width="250" height="142" rx="24" fill="#FFFFFF"/>
    <circle cx="126" cy="447" r="22" fill="#FFF1D6"/><path d="M116 447l7 7 15-17" fill="none" stroke="#E68A00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="166" y="455" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#14213D">标签或反馈</text>
    <text x="104" y="505" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#5B6B7F">告诉模型“做得有多好”</text>
  </g>
  <path d="M346 360H445" stroke="#64748B" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="472" y="210" width="308" height="316" rx="30" fill="url(#model)"/>
    <text x="626" y="271" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#FFFFFF">学习算法</text>
    <g fill="#FFFFFF" fill-opacity=".22" stroke="#FFFFFF" stroke-opacity=".72" stroke-width="2">
      <circle cx="548" cy="349" r="20"/><circle cx="548" cy="421" r="20"/><circle cx="626" cy="326" r="20"/><circle cx="626" cy="385" r="20"/><circle cx="626" cy="444" r="20"/><circle cx="704" cy="349" r="20"/><circle cx="704" cy="421" r="20"/>
      <path d="M568 349l38-23M568 349l38 36M568 421l38-36M568 421l38 23M646 326l38 23M646 385l38-36M646 385l38 36M646 444l38-23"/>
    </g>
    <text x="626" y="492" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#EAF7FF">比较预测与答案，反复调整参数</text>
  </g>
  <path d="M808 360H907" stroke="#64748B" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="934" y="194" width="274" height="172" rx="24" fill="#FFFFFF"/>
    <circle cx="990" cy="247" r="24" fill="#E7EEFF"/><path d="M978 254c16-24 31-15 31-15" fill="none" stroke="#3867D6" stroke-width="4" stroke-linecap="round"/><circle cx="1008" cy="239" r="4" fill="#3867D6"/>
    <text x="1030" y="255" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#14213D">训练好的模型</text>
    <text x="966" y="313" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#5B6B7F">参数保存了可迁移的模式</text>
    <rect x="934" y="397" width="274" height="142" rx="24" fill="#FFFFFF"/>
    <text x="966" y="449" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700" fill="#14213D">预测新数据</text>
    <text x="966" y="495" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#5B6B7F">分类、数值、内容或行动</text>
  </g>
  <rect x="72" y="596" width="1136" height="62" rx="18" fill="#E9F2FF"/>
  <text x="640" y="636" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="22" font-weight="600" fill="#214E86">关键检验：面对没有见过的新数据，模型是否仍然表现可靠？</text>
</svg>
