<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">监督学习、无监督学习和强化学习</title>
  <desc id="desc">三种学习方式分别依靠标签、数据结构和奖励反馈。</desc>
  <rect width="1280" height="720" rx="32" fill="#F8FAFC"/>
  <text x="64" y="82" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" fill="#152238">三种学习方式，区别在于模型收到怎样的反馈</text>
  <g font-family="Microsoft YaHei, sans-serif">
    <g transform="translate(64 145)">
      <rect width="354" height="470" rx="28" fill="#FFFFFF" stroke="#CFE9DF" stroke-width="3"/>
      <circle cx="177" cy="82" r="48" fill="#DFF7EE"/><path d="M153 83l15 15 34-41" fill="none" stroke="#0F9D75" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="177" y="160" text-anchor="middle" font-size="29" font-weight="700" fill="#0B6B55">监督学习</text>
      <text x="177" y="197" text-anchor="middle" font-size="19" fill="#64748B">有参考答案</text>
      <rect x="32" y="232" width="290" height="72" rx="16" fill="#F0FBF7"/><text x="177" y="262" text-anchor="middle" font-size="18" font-weight="600" fill="#23483E">数据 + 标签</text><text x="177" y="288" text-anchor="middle" font-size="17" fill="#64748B">“这张是猫，那张是狗”</text>
      <text x="42" y="350" font-size="18" fill="#374151">典型任务</text><text x="42" y="386" font-size="18" fill="#64748B">分类：属于哪一类</text><text x="42" y="419" font-size="18" fill="#64748B">回归：数值是多少</text>
    </g>
    <g transform="translate(463 145)">
      <rect width="354" height="470" rx="28" fill="#FFFFFF" stroke="#D6DEFA" stroke-width="3"/>
      <circle cx="177" cy="82" r="48" fill="#E9EEFF"/><g fill="#4F67D8"><circle cx="160" cy="70" r="9"/><circle cx="184" cy="62" r="9"/><circle cx="195" cy="86" r="9"/><circle cx="151" cy="96" r="9"/></g>
      <text x="177" y="160" text-anchor="middle" font-size="29" font-weight="700" fill="#3949A4">无监督学习</text>
      <text x="177" y="197" text-anchor="middle" font-size="19" fill="#64748B">没有标准答案</text>
      <rect x="32" y="232" width="290" height="72" rx="16" fill="#F3F5FF"/><text x="177" y="262" text-anchor="middle" font-size="18" font-weight="600" fill="#303B7D">只有数据</text><text x="177" y="288" text-anchor="middle" font-size="17" fill="#64748B">寻找相似性和隐藏结构</text>
      <text x="42" y="350" font-size="18" fill="#374151">典型任务</text><text x="42" y="386" font-size="18" fill="#64748B">聚类：谁和谁更相似</text><text x="42" y="419" font-size="18" fill="#64748B">降维：怎样压缩表示</text>
    </g>
    <g transform="translate(862 145)">
      <rect width="354" height="470" rx="28" fill="#FFFFFF" stroke="#F3D7B4" stroke-width="3"/>
      <circle cx="177" cy="82" r="48" fill="#FFF2DE"/><path d="M177 49l10 21 23 3-17 17 4 24-20-11-21 11 4-24-17-17 24-3z" fill="#F39C3D"/>
      <text x="177" y="160" text-anchor="middle" font-size="29" font-weight="700" fill="#A65A16">强化学习</text>
      <text x="177" y="197" text-anchor="middle" font-size="19" fill="#64748B">从行动结果获得反馈</text>
      <rect x="32" y="232" width="290" height="72" rx="16" fill="#FFF8EC"/><text x="177" y="262" text-anchor="middle" font-size="18" font-weight="600" fill="#7A4A18">状态 + 行动 + 奖励</text><text x="177" y="288" text-anchor="middle" font-size="17" fill="#64748B">尝试后再调整策略</text>
      <text x="42" y="350" font-size="18" fill="#374151">典型任务</text><text x="42" y="386" font-size="18" fill="#64748B">游戏：争取长期高奖励</text><text x="42" y="419" font-size="18" fill="#64748B">机器人：学习行动策略</text>
    </g>
  </g>
  <text x="640" y="665" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#5B6B7F">真实系统经常组合多种方式；“深度学习”描述模型结构，并不等同于其中某一种反馈方式。</text>
</svg>
